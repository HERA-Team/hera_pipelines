# Phase II IDR1 per-night analysis configuration.
#
# Doubles as the makeflow workflow definition and the notebooks' direct configuration:
# each notebook reads the sections named below via toml.load(TOML_FILE), injecting keys
# as uppercase globals, so do scripts pass only paths.

[Options]
makeflow_type = "analysis"
source_script = "~/.bashrc"
base_mem = 23500  # TODO: tune once file_sky_calibration has run at scale
base_cpu = 1
timeout = "24h"
path_to_do_scripts = "/lustre/aoc/projects/hera/phase-II-analysis/idr1/src/hera_pipelines/pipelines/phase_II/idr1/v1/analysis/task_scripts"
conda_env = "phase_II_idr1"
batch_system = "slurm"

[NOTEBOOK_OPTS]
toml_file = "/lustre/aoc/projects/hera/phase-II-analysis/idr1/src/hera_pipelines/pipelines/phase_II/idr1/v1/analysis/phase_II_analysis.toml"
nb_template_dir = '/lustre/aoc/projects/hera/phase-II-analysis/idr1/src/hera_notebook_templates/notebooks/phase_II'
nb_output_repo = '/lustre/aoc/projects/hera/phase-II-analysis/idr1/notebooks'

[GLOBAL_OPTS]  # shared across notebooks
band_split_freq = 100.0  # in MHz; divides the low and high bands (inside the a priori flagged FM gap)

[FILE_SKY_CAL_OPTS]  # Read directly by the file_sky_calibration notebook
# use_diff = false  # if unset, defaults to true for JD < 2460039 (diffs were only recorded through the H6C era), else false
sky_model_files_glob = '/lustre/aoc/projects/hera/h6c-analysis/abscal_models/h6c_filtered_lst_stack/zen.*.sum.sky_model.uvh5'
skycal_min_bl_len = 1.0    # in meters
skycal_max_bl_len = 120.0  # in meters
sc_maxiter = 100
sc_max_rerun = 10
sc_max_divergent_chans = 25
max_band_flag_frac = 0.5
apriori_flag_freq_ranges = [[87.5, 108.0], [222.6, 235.0]]  # in MHz; default flags FM and the top X-engine block
sc_max_chisq_flagging_dynamic_range = 1.5
calibrate_cross_pols = true
auto_repair_identities = true
skip_outriggers = true
cross_rfi_min_samp_frac = 0.15
cross_rfi_filter_delay = 750.0  # in ns
cross_rfi_z_thresh = 4.0
cross_rfi_ws_z_thresh = 2.0
rfi_dpss_halfwidth = 300e-9  # in s
rfi_nsig = 4.0

[ANT_CLASS_BOUNDS]  # Read directly by the file_sky_calibration notebook
am_corr_bad = 0.35
am_corr_suspect = 0.45
am_xpol_bad = -0.1
am_xpol_suspect = 0.0
suspect_solar_altitude = -4.0
bad_solar_altitude = -2.0
max_zeros_per_eo_spec_good = 2
max_zeros_per_eo_spec_suspect = 8
auto_power_good_low = 5.0
auto_power_good_high = 30.0
auto_power_suspect_low = 1.0
auto_power_suspect_high = 60.0
auto_slope_good_low = -0.4
auto_slope_good_high = 0.4
auto_slope_suspect_low = -0.6
auto_slope_suspect_high = 0.6
auto_rfi_good = 1.5
auto_rfi_suspect = 2.0
auto_shape_good = 0.1
auto_shape_suspect = 0.2
bad_xengine_zcut = 10.0
identity_coherence_good = 0.75
identity_coherence_suspect = 0.5
identity_repair_margin = 0.1
sc_cspa_good = 2.0
sc_cspa_suspect = 3.0
cal_auto_model_good = 1.5
cal_auto_model_suspect = 2.0
deco_max_suspect = 0.05
deco_max_bad = 0.10
deco_jump_suspect = 0.025
deco_jump_bad = 0.05

[FULL_DAY_RFI_OPTS]  # Read directly by the full_day_rfi notebook
z_thresh = 4.0
ws_z_thresh = 2.0
avg_z_thresh = 1.0
max_freq_flag_frac = 0.25
max_time_flag_frac = 0.1
avg_spectrum_filter_delay = 250.0  # in ns
eigenval_cutoff = 1e-12
time_avg_delay_filt_snr_thresh = 4.0
time_avg_delay_filt_snr_dynamic_range = 1.5
time_conv_size = 300.0  # in s

[FULL_DAY_ANT_FLAG_OPTS]  # Read directly by the full_day_antenna_flagging notebook
smoothing_scale_nfiles = 30
max_flag_gap_nfiles = 30
auto_power_max_flag_frac = 0.5
auto_shape_max_flag_frac = 0.25
auto_slope_max_flag_frac = 0.25
auto_rfi_max_flag_frac = 0.25
chisq_max_flag_frac = 0.5
cal_auto_max_flag_frac = 0.25
deco_max_flag_frac = 0.5
identity_max_flag_frac = 0.25
xengine_max_flag_frac = 0.05
overall_max_flag_frac = 0.5
skip_outriggers = true

############################################################################################################

[DATA_PRODUCTS]  # Read by the notebooks and by build_notebook_index.py
# Every file the pipeline reads or writes, declared once so that no filename convention is
# hardcoded in a notebook or a task script.
#
# Each notebook injects the entries wired to its own [WorkFlow] action -- by produced_by or
# consumed_by -- as <NAME>_SUFFIX globals, and asserts that this wiring matches the suffix
# defaults it declares for itself. So wiring an edge here without a matching read or write in
# the notebook fails the run in its first cell, and the flowchart that build_notebook_index.py
# draws on the top-level index.html cannot claim a data flow that does not exist.
#
#   suffix      -- replaces 'sum.uvh5' on a raw sum file, so a night's files are named
#                  zen.{JD}.{suffix}. This is the only field that drives the injection and
#                  the assertion above; omit it for inputs that are not per-sum-file.
#   label       -- what the flowchart calls it
#   kind        -- raw | calibration | metrics | ancillary | external; sets the node color
#   produced_by -- the action(s) that write it, string or list (e.g. when a later stage
#                  overwrites a product); omitted for inputs from outside this workflow
#   consumed_by -- the actions that read it
#   filename    -- display only: the naming pattern printed under the label on the flowchart,
#                  for products with no per-sum-file suffix. Optional; injects nothing.
#   note        -- display only: free text shown in the flowchart's hover tooltip, for what
#                  the label and kind do not convey. Optional; injects nothing.

[DATA_PRODUCTS.SUM]
suffix = "sum.uvh5"
label = "4-pol Raw Sum Data"
kind = "raw"
consumed_by = ["FILE_SKY_CAL_NOTEBOOK", "FULL_DAY_RFI_NOTEBOOK", "FULL_DAY_ANTENNA_FLAGGING_NOTEBOOK"]

[DATA_PRODUCTS.DIFF]
suffix = "diff.uvh5"
label = "4-pol Raw Diff Data"
kind = "raw"
consumed_by = ["FILE_SKY_CAL_NOTEBOOK"]  # only through the H6C era; see use_diff

[DATA_PRODUCTS.SKY_MODEL]
label = "Externally Calibrated, Redundantly Averaged, LST-Stacked, Filtered Data"
filename = "zen.*.sum.sky_model.uvh5"  # display only: LST-indexed, so there is no per-sum-file suffix
note = "Real data, not a simulation: the H6C filtered LST stack, used here as the abscal model."
kind = "external"
consumed_by = ["FILE_SKY_CAL_NOTEBOOK"]  # located by [FILE_SKY_CAL_OPTS] sky_model_files_glob

[DATA_PRODUCTS.RTP_ANT_CLASS]
suffix = "sum.rtp_ant_class.csv"
label = "RTP Antenna Classifications"
kind = "external"
consumed_by = ["FILE_SKY_CAL_NOTEBOOK"]  # stands in for the diff-based classifiers when use_diff is false

[DATA_PRODUCTS.AM]
suffix = "sum.ant_metrics.hdf5"
label = "Antenna Metrics"
kind = "metrics"
produced_by = "FILE_SKY_CAL_NOTEBOOK"

[DATA_PRODUCTS.ANT_CLASS]
suffix = "sum.ant_class.csv"
label = "Antenna Classifications"
kind = "metrics"
produced_by = "FILE_SKY_CAL_NOTEBOOK"
consumed_by = ["FULL_DAY_ANTENNA_FLAGGING_NOTEBOOK"]

[DATA_PRODUCTS.SKY_CAL]
suffix = "sum.sky.calfits"
label = "Sky-Calibrated Gain Solutions"
kind = "calibration"
produced_by = "FILE_SKY_CAL_NOTEBOOK"
consumed_by = ["FULL_DAY_ANTENNA_FLAGGING_NOTEBOOK"]

[DATA_PRODUCTS.DECOHERENCE]
suffix = "sum.snap_decoherence.h5"
label = "SNAP Decoherence"
kind = "metrics"
produced_by = "FILE_SKY_CAL_NOTEBOOK"

[DATA_PRODUCTS.RED_AVG_ZSCORE]
suffix = "sum.red_avg_zscore.h5"
label = "Delay-Filtered, Redundantly Averaged z-Score"
kind = "metrics"
produced_by = "FILE_SKY_CAL_NOTEBOOK"
consumed_by = ["FULL_DAY_RFI_NOTEBOOK"]

[DATA_PRODUCTS.FLAG_WATERFALL]
suffix = "sum.flag_waterfall.h5"
label = "Full-Day RFI Flags"
kind = "metrics"
produced_by = "FULL_DAY_RFI_NOTEBOOK"
consumed_by = ["CALIBRATION_SMOOTHING_NOTEBOOK"]

[DATA_PRODUCTS.APOSTERIORI_YAML]
label = "A Posteriori Flags"
filename = "{JD}_aposteriori_flags.yaml"  # display only: per-day, so there is no per-sum-file suffix
note = "The day's final entirely-flagged times, frequencies, and antennas (ex_ants), written by the last stage that touches flags."
kind = "ancillary"
produced_by = "CALIBRATION_SMOOTHING_NOTEBOOK"

[DATA_PRODUCTS.APRIORI_FLAGS]
label = "A Priori Flags (Optional)"
kind = "ancillary"
consumed_by = ["FULL_DAY_ANTENNA_FLAGGING_NOTEBOOK"]

[DATA_PRODUCTS.ANTENNA_FLAGS]
suffix = "sum.antenna_flags.h5"
label = "Per-File Antenna Flags"
kind = "metrics"
produced_by = "FULL_DAY_ANTENNA_FLAGGING_NOTEBOOK"
consumed_by = ["CALIBRATION_SMOOTHING_NOTEBOOK"]

[DATA_PRODUCTS.SMOOTH_CAL]
suffix = "sum.smooth.calfits"
label = "Smoothed Gain Solutions"
kind = "calibration"
note = "Staircase-FREE: per-SNAP decoherence is removed before smoothing and applied downstream from the sidecars (e.g. by apply_cal.calibrate_and_red_avg)."
produced_by = "CALIBRATION_SMOOTHING_NOTEBOOK"

############################################################################################################

[WorkFlow]
actions = ["FILE_SKY_CAL_NOTEBOOK",
           "FULL_DAY_RFI_NOTEBOOK",
           "FULL_DAY_ANTENNA_FLAGGING_NOTEBOOK",
           "CALIBRATION_SMOOTHING_NOTEBOOK"]

[FILE_SKY_CAL_NOTEBOOK]
args = ["{basename}",
        "${NOTEBOOK_OPTS:toml_file}",
        "${NOTEBOOK_OPTS:nb_template_dir}",
        "${NOTEBOOK_OPTS:nb_output_repo}"]

[FULL_DAY_RFI_NOTEBOOK]
prereqs = "FILE_SKY_CAL_NOTEBOOK"
prereq_chunk_size = "all"
chunk_size = 1
stride_length = "all"
time_centered = false
args = ["{basename}",
        "${NOTEBOOK_OPTS:toml_file}",
        "${NOTEBOOK_OPTS:nb_template_dir}",
        "${NOTEBOOK_OPTS:nb_output_repo}"]

[FULL_DAY_ANTENNA_FLAGGING_NOTEBOOK]
prereqs = "FILE_SKY_CAL_NOTEBOOK"
prereq_chunk_size = "all"
chunk_size = 1
stride_length = "all"
time_centered = false
args = ["{basename}",
        "${NOTEBOOK_OPTS:toml_file}",
        "${NOTEBOOK_OPTS:nb_template_dir}",
        "${NOTEBOOK_OPTS:nb_output_repo}"]

[CALIBRATION_SMOOTHING_NOTEBOOK]
prereqs = ["FULL_DAY_RFI_NOTEBOOK", "FULL_DAY_ANTENNA_FLAGGING_NOTEBOOK"]
prereq_chunk_size = "all"
chunk_size = 1
stride_length = "all"
time_centered = false
args = ["{basename}",
        "${NOTEBOOK_OPTS:toml_file}",
        "${NOTEBOOK_OPTS:nb_template_dir}",
        "${NOTEBOOK_OPTS:nb_output_repo}"]
